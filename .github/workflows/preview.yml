name: Cinematic preview
# Builds the cinematic-preview branch and publishes it to the gh-pages
# branch under /preview, so changes can be tried at
# https://muzammilq100.github.io/muzammil-portfolio/preview/
# without touching master or the live Cloudflare site.
permissions:
  contents: write
on:
  push:
    branches:
      - cinematic-preview
  workflow_dispatch:

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build the site into dist/
        run: SITE_URL=https://muzammilq100.github.io/muzammil-portfolio/preview npm run build
      - name: Publish under /preview
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          target-folder: preview
          clean: true
          token: ${{ secrets.GITHUB_TOKEN }}
