name: Build and Deploy
permissions:
  contents: write
on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # set in the repository's Settings > Secrets; until they are there,
      # the Cloudflare step below is skipped
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build the site into dist/
        run: npm run build
      - name: Publish to GitHub Pages (backup address)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          clean-exclude: preview
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Storage for the conservatory's roses (Workers KV)
        if: ${{ env.CF_TOKEN != '' && env.CF_ACCOUNT != '' }}
        run: |
          API="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/storage/kv/namespaces"
          ID=$(curl -fsS -H "Authorization: Bearer $CF_TOKEN" "$API?per_page=100" | jq -r '.result[] | select(.title=="muzammil-gallery-roses") | .id' | head -n 1 || true)
          if [ -z "$ID" ]; then
            ID=$(curl -fsS -X POST -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" --data '{"title":"muzammil-gallery-roses"}' "$API" | jq -r '.result.id' || true)
          fi
          if [ -n "$ID" ] && [ "$ID" != "null" ]; then
            printf 'name = "muzammil-gallery"\npages_build_output_dir = "dist"\ncompatibility_date = "2024-09-23"\n\n[[kv_namespaces]]\nbinding = "ROSES"\nid = "%s"\n' "$ID" > wrangler.toml
            echo "The roses are kept in KV namespace $ID"
          else
            echo "::warning::Could not set up storage for the roses (the Cloudflare token needs 'Workers KV Storage: Edit'). Each visitor will see only their own roses."
          fi
      - name: Publish to Cloudflare Pages
        if: ${{ env.CF_TOKEN != '' && env.CF_ACCOUNT != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3 pages project create muzammil-gallery --production-branch=main || true
          npx --yes wrangler@3 pages deploy dist --project-name=muzammil-gallery --branch=main --commit-dirty=true
