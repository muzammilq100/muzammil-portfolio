I could no longer smell them.\nYou reached for my hand when it was already cold.\u201d\n\nThis work is not just about death\u2014it\u2019s about being noticed only when you\u2019re gone. It\u2019s about how easily people forget your flaws once you\u2019re no longer around to inconvenience them. How we wait for silence to speak love. How we mourn more for our comfort than for the person who\u2019s passed.\n\nIt asks one question, quietly but sharply:\n\nWhy must someone die before we finally decide they were worthy of love?","True love is an act of shelter, but it is incredibly easy for that shelter to quietly warp into a cage. We fall into the trap of believing that because we love someone deeply, they belong near us, that our affection is enough to justify keeping them close, even when their spirit is pulling toward a completely different horizon. But love isn't a possession. It isn't a debt or a contract of ownership. Realising that you are holding someone back against their will, and choosing to unlatch the door anyway, is perhaps the rawest, most devastating form of love there is. It is the moment you value their breathing room more than your own comfort.\n\nBut there is a second, heavier truth hidden in that departure, and it rests entirely in the feather left behind in her fingers. Freedom is rarely a clean break; it demands a physical toll. The bird didn't just fly away unharmed. It had to leave a part of itself behind in order to slip through the bars. That single feather is the currency of its flight. It means that when we finally let someone go, they don't leave whole, and we don't end up completely empty-handed. They leave a piece of their identity locked in our grasp, a permanent casualty of the time they spent confined. She is left holding the physical receipt of his freedom, a reminder that the hardest gift you can give someone always costs a piece of both of you.","There is a unique kind of sorrow in mourning something you were never supposed to have, or holding onto a loss the world expects you to simply forget. When grief is disallowed by circumstances, society, or our own rigid rules, it cannot be shared. It becomes an isolated country.\n\nIn A Private Eulogy, the subject turns her back completely to the world. Her posture is not collapsed in defeat; it is held together with immense, quiet effort, the rigid stillness of someone delivering a final, silent tribute inside her own mind. Clad in a heavy black shroud of self-imposed composure, she creates a boundary that no one else can cross.\n\nShe sits alone, at the altar of her own thoughts, giving a beautiful, unauthorized goodbye to a memory that only she is left to honor. We will never know exactly what she is honoring. The viewer is left standing outside the door of her thoughts, witnessing the sheer gravity of a quiet, beautiful goodbye.","I built them one at a time, though I don't remember choosing to. I only remember needing them.\n\nThe first stands above, where thought begins. It doesn't watch the world, it watches me: deciding, in silence, what takes root and what dissolves before it ever becomes belief. I never asked for a guardian of the mind. I just found myself with one, already old, already certain of its job.\n\nThe second lies across my mouth. Every word has to pass beneath it first: weighed, questioned, sometimes let through, sometimes swallowed whole. I built this one out of every \u201cshould I say this\u201d I ever asked myself and answered wrong, out of every sentence I decided, halfway through, not to finish.\n\nThe third turns away, facing down, toward everything I've carried but never looked at directly. It doesn't guard my face or my words. It holds what's buried. And the second guardian leans back against it, quietly confessing what I already knew: my voice was never really mine alone. It rests on everything underneath it that I haven't processed yet.\n\nBetween the first guardian and the second, only one eye stays uncovered. Mind, contained. Voice, filtered. And still, I see.\n\nI built these so carefully, so early, that I forgot they were built at all.\n\nThis isn't a portrait of a woman hiding behind her defenses. It's a portrait of the defenses themselves, raised by her for her so quietly that even she had to look twice to recognize it as her own."],Ut=[{side:"right",z:34.5},{side:"right",z:44.2},{side:"left",z:44.2},{side:"end",z:47.64}];function Nt(t,e,n){var r=Ut[n],i=[],o=4-e/2;return"left"===r.side?(Lt(i,[.36,o,r.z+t/2]),Ct(i,i,Math.PI/2)):"right"===r.side?(Lt(i,[13.64,o,r.z-t/2]),Ct(i,i,-Math.PI/2)):(Lt(i,[7+t/2,o,47.64]),Ct(i,i,Math.PI)),jt(i,i,[t,e,.12]),i}function qt(t,e,n){var r=Ut[n],i=[],o=4-e/2;return"left"===r.side?(Lt(i,[.36,o,r.z+t/2]),Ct(i,i,Math.PI/2)):"right"===r.side?(Lt(i,[13.64,o,r.z-t/2]),Ct(i,i,-Math.PI/2)):(Lt(i,[7+t/2,o,47.64]),Ct(i,i,Math.PI)),i}function Vt(t,e,n){var r=Ut[n],i=[],o=4-e/2-.26-.38;return"left"===r.side?(Lt(i,[.356,o,r.z+t/2]),Ct(i,i,Math.PI/2)):"right"===r.side?(Lt(i,[13.644,o,r.z-t/2]),Ct(i,i,-Math.PI/2)):(Lt(i,[7+t/2,o,47.644]),Ct(i,i,Math.PI)),jt(i,i,[2,2,2]),i}function Wt(t,e,n){var r=Ut[n],i=4-e/2-.26-.38;return"left"===r.side?[.91,i,r.z]:"right"===r.side?[13.09,i,r.z]:[7,i,47.09]}var Ht,Gt=c(W),Yt=[[-.02,.125],[-.02,.15],[.035,.15],[.07,.12],[.07,.17],[.185,.17],[.185,.19],[.215,.19],[.26,.03]],Xt=function(t,e,n){return t[0]=e[0]-n[0],t[1]=e[1]-n[1],t[2]=e[2]-n[2],t},Qt=function(t,e){var n=e[0]-t[0],r=e[1]-t[1],i=e[2]-t[2];return Math.sqrt(n*n+r*r+i*i)},Kt=function(t){var e=t[0],n=t[1],r=t[2];return Math.sqrt(e*e+n*n+r*r)},$t=function(t,e){var n=e[0],r=e[1],i=e[2],o=n*n+r*r+i*i;return o>0&&(o=1/Math.sqrt(o),t[0]=e[0]*o,t[1]=e[1]*o,t[2]=e[2]*o),t},Jt=function(t,e){return t[0]*e[0]+t[1]*e[1]+t[2]*e[2]},Zt=((Ht=new Float32Array(3))[0]=0,Ht[1]=0,Ht[2]=0,{set:function(t,e,n,r){return t[0]=e,t[1]=n,t[2]=r,t},add:function(t,e,n){return t[0]=e[0]+n[0],t[1]=e[1]+n[1],t[2]=e[2]+n[2],t},sub:Xt,scale:function(t,e,n){return t[0]=e[0]*n,t[1]=e[1]*n,t[2]=e[2
